<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Efe Şuşutgil - Kişisel Web Sitesi</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 30px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            margin-bottom: 20px;
            border: 3px solid #38bdf8;
            object-fit: cover;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: #f8fafc;
        }

        .subtitle {
            color: #38bdf8;
            font-size: 0.95rem;
            margin-bottom: 20px;
            font-weight: 500;
        }

        p {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 25px;
        }

        .tag {
            background: #334155;
            color: #e2e8f0;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            background: #2563eb;
            color: #ffffff;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            transition: background 0.2s ease;
        }

        .btn:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="card">
        <img class="avatar" src="profil.jpg" alt="Efe Şuşutgil">
        
        <h1>Efe Şuşutgil</h1>
        <div class="subtitle">Yazılım & Tasarım Projeleri</div>
        
        <p>Yazılım geliştirme, Python ile oyun yapımı, HTML/CSS ve 3D tasarımla ilgileniyorum. Yeni teknoloji projeleri üretmeyi seviyorum.</p>

        <div class="tags">
            <span class="tag">Python</span>
            <span class="tag">Pygame</span>
            <span class="tag">HTML5 / CSS3</span>
            <span class="tag">3D Tasarım</span>
        </div>

        <div class="links">
            <a href="https://github.com" class="btn" target="_blank">GitHub Projelerim</a>
        </div>
    </div>

</body>
</html>
